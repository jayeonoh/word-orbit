<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Word Orbit · 나의 단어 우주</title>
  <meta name="description" content="책에서 만난 단어가 오래 남는 기억으로. 서버 없이 동작하는 아이 단어장.">
  <meta name="theme-color" content="#6d5bd0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Word Orbit">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><div class="onboard"><div class="brand big">✦ Word Orbit</div><p class="muted">나의 단어 우주를 여는 중…</p></div></div>
  <div id="dialog" hidden></div>
  <div id="toasts"></div>
  <script>
    // 시작 중 문제가 생기면 화면에 원인을 보여줍니다 (개발자 도구 없이도 확인 가능)
    window.__woShowError = function (msg) {
      var el = document.getElementById('app');
      el.innerHTML = '<div class="onboard"><div class="brand big">✦ Word Orbit</div><h2>앱을 여는 중 문제가 생겼어요</h2><p class="info-line" style="word-break:break-all">' + String(msg).replace(/</g, '&lt;') + '</p><p class="muted small">인터넷 연결을 확인하고 앱을 완전히 닫았다가 다시 열어 보세요. 계속되면 이 화면을 캡처해서 앱을 알려준 분께 보내주세요.</p></div>';
    };
    // 앱이 열리기 전(부팅 중) 오류만 화면에 보여줍니다. 열린 뒤의 오류는 콘솔에만 남기고 화면은 유지합니다.
    window.addEventListener('error', function (e) { if (window.__woBooted) { console.warn('[wo]', e.message); return; } if (e.message === 'Script error.' && !e.filename) return; window.__woShowError((e.message || e.type) + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
    window.addEventListener('unhandledrejection', function (e) { if (window.__woBooted) { console.warn('[wo]', e.reason); return; } window.__woShowError(e.reason && e.reason.message ? e.reason.message : e.reason); });
    window.__woBootTimer = setTimeout(function () { if (!window.__woBooted) window.__woShowError('10초 안에 앱이 열리지 않았어요. 인터넷이 느리거나 브라우저가 옛 파일을 들고 있을 수 있어요.'); }, 10000);
  </script>
  <script type="module" src="js/app.js?v=9"></script>
</body>
</html>
