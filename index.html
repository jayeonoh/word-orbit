<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Word Orbit · 나의 단어 우주</title>
  <meta name="description" content="책에서 만난 단어가 오래 남는 기억으로. 서버 없이 동작하는 아이 단어장.">
  <meta name="theme-color" content="#6d5bd0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Word Orbit">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><div class="onboard"><div class="brand big">✦ Word Orbit</div><p class="muted">나의 단어 우주를 여는 중…</p></div></div>
  <div id="dialog" hidden></div>
  <div id="toasts"></div>
  <script>
    // 시작 중 문제가 생기면 화면에 원인을 보여줍니다 (개발자 도구 없이도 확인 가능)
    window.__woShowError = function (msg) {
      var el = document.getElementById('app');
      el.innerHTML = '<div class="onboard"><div class="brand big">✦ Word Orbit</div><h2>앱을 여는 중 문제가 생겼어요</h2><p class="info-line" style="word-break:break-all">' + String(msg).replace(/</g, '&lt;') + '</p><p class="muted small">터미널의 서버가 켜져 있는지 확인하고 Cmd+Shift+R로 새로고침해 보세요. 이 메시지를 그대로 Claude에게 보내주면 원인을 찾을 수 있어요.</p></div>';
    };
    window.addEventListener('error', function (e) { window.__woShowError((e.message || e.type) + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
    window.addEventListener('unhandledrejection', function (e) { window.__woShowError(e.reason && e.reason.message ? e.reason.message : e.reason); });
    window.__woBootTimer = setTimeout(function () { if (!window.__woBooted) window.__woShowError('10초 안에 앱이 열리지 않았어요. 서버(터미널)가 꺼졌거나 브라우저가 옛 파일을 들고 있을 수 있어요.'); }, 10000);
  </script>
  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
